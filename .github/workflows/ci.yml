name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts }
      - run: cargo test --manifest-path contracts/Cargo.toml

  differential:
    # full pipeline: TS generates the crate, Rust proves the permit/deny matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsx examples/blend-yield-claim/make-recording.ts
      - run: cargo test --manifest-path contracts/generated/warden_policy_blend/Cargo.toml
